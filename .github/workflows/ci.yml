name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS 14 is the deployment target, but no runner image ships it any more.
    # The pinned image is what a release is built on; macos-latest is what the
    # next Xcode lands on first, so a break shows up here rather than in a
    # release.
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Unsigned, so this needs no secrets and no certificate. Signing and
      # notarization happen in trsdn/macos-notarization-broker, never here.
      - name: Build and test
        run: |
          xcodebuild test \
            -project OpenLens.xcodeproj \
            -scheme OpenLens \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  format:
    name: Formatting
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # swift-format ships with Xcode, so this needs nothing installed. The
      # configuration is committed, so the check and a local run agree.
      - name: Check formatting
        run: xcrun swift-format lint --strict --parallel --configuration .swift-format --recursive Sources Tests

  project-file:
    name: Xcode project is up to date
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # The broker builds from the committed project file, so a project.yml
      # change that was never regenerated would ship stale build settings.
      - name: Regenerate and diff
        run: |
          xcodegen generate
          if ! git diff --exit-code -- OpenLens.xcodeproj; then
            echo "::error::OpenLens.xcodeproj is out of date with project.yml. Run 'xcodegen generate' and commit the result."
            exit 1
          fi
